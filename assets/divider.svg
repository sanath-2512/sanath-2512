<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 28" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .core { animation: pulseCore 2.8s ease-in-out infinite; transform-origin: 410px 14px; }
      .shimmer { animation: shimmerMove 3.5s linear infinite; }
      @keyframes pulseCore { 0%,100% { r: 3.5; opacity: 0.7; } 50% { r: 4.5; opacity: 1; } }
      @keyframes shimmerMove { 0% { transform: translateX(-820px); opacity: 0; } 20% { opacity: 0.6; } 100% { transform: translateX(820px); opacity: 0; } }
    </style>
  </defs>
  <rect x="0" y="13" width="820" height="1" fill="#1f2937" opacity="0.8"/>
  <rect x="0" y="13" width="820" height="1" fill="url(#line)"/>
  <circle cx="410" cy="14" r="3.5" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.2" class="core"/>
  <circle cx="410" cy="14" r="1.2" fill="#00d4ff"/>
  <rect x="0" y="12" width="120" height="3" fill="#ffffff" opacity="0.08" class="shimmer"/>
</svg>
