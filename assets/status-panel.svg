<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 168" role="img" aria-label="Currently building">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .dot1 { animation: blinkDot 2s ease-in-out infinite; }
      .dot2 { animation: blinkDot 2s ease-in-out 0.35s infinite; }
      .dot3 { animation: blinkDot 2s ease-in-out 0.7s infinite; }
      .status { animation: statusPulse 2.4s ease-in-out infinite; }
      @keyframes blinkDot { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes statusPulse { 0%,100% { fill: #22d3ee; } 50% { fill: #67e8f9; } }
    </style>
  </defs>

  <rect x="8" y="8" width="804" height="152" rx="12" fill="url(#panelBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="8" y="8" width="804" height="34" rx="12" fill="#0f172a" opacity="0.85"/>
  <rect x="8" y="30" width="804" height="12" fill="#0f172a" opacity="0.85"/>

  <text x="28" y="30" class="mono" fill="#94a3b8" font-size="11" letter-spacing="2">CURRENTLY BUILDING</text>
  <text x="760" y="30" text-anchor="end" class="mono status" font-size="11" letter-spacing="1">BUILDING</text>

  <circle cx="36" cy="68" r="4" fill="#00d4ff" class="dot1"/>
  <text x="52" y="72" class="mono" fill="#e2e8f0" font-size="14">Multi-agent job intelligence</text>
  <text x="52" y="88" class="mono" fill="#64748b" font-size="11">WorthyApply - resume analysis, match scoring, grounded rewrites</text>

  <circle cx="36" cy="112" r="4" fill="#8b5cf6" class="dot2"/>
  <text x="52" y="116" class="mono" fill="#e2e8f0" font-size="14">AI-native learning platforms</text>
  <text x="52" y="132" class="mono" fill="#64748b" font-size="11">EduAI - generated courses, quizzes, progress tracking</text>

  <circle cx="420" cy="68" r="4" fill="#22d3ee" class="dot3"/>
  <text x="436" y="72" class="mono" fill="#e2e8f0" font-size="14">Document to dataset pipelines</text>
  <text x="436" y="88" class="mono" fill="#64748b" font-size="11">PDF extraction, structured LLM output, fine-tuning prep</text>

  <circle cx="420" cy="112" r="4" fill="#a78bfa" class="dot1"/>
  <text x="436" y="116" class="mono" fill="#e2e8f0" font-size="14">Production AI web apps</text>
  <text x="436" y="132" class="mono" fill="#64748b" font-size="11">FastAPI, Next.js, deployable full-stack systems</text>
</svg>
