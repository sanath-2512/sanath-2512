<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="Sanath Waraikar system boot">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070d"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12101f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
    <clipPath id="termClip">
      <rect x="28" y="28" width="764" height="184" rx="10"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .fade1 { opacity: 0; animation: fadeIn 0.4s ease forwards; animation-delay: 0.3s; }
      .fade2 { opacity: 0; animation: fadeIn 0.4s ease forwards; animation-delay: 0.9s; }
      .fade3 { opacity: 0; animation: fadeIn 0.4s ease forwards; animation-delay: 1.5s; }
      .fade4 { opacity: 0; animation: fadeIn 0.4s ease forwards; animation-delay: 2.1s; }
      .fade5 { opacity: 0; animation: fadeIn 0.4s ease forwards; animation-delay: 2.7s; }
      .fade6 { opacity: 0; animation: fadeIn 0.4s ease forwards; animation-delay: 3.3s; }
      .barFill { animation: loadBar 2.2s ease-in-out forwards; animation-delay: 1.8s; transform-origin: left center; transform: scaleX(0); }
      .scan { animation: scanMove 4s linear infinite; }
      .pulse { animation: pulseDot 2s ease-in-out infinite; }
      .titleGlow { animation: titlePulse 3s ease-in-out infinite; }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes loadBar { to { transform: scaleX(1); } }
      @keyframes scanMove { 0% { transform: translateX(-820px); } 100% { transform: translateX(820px); } }
      @keyframes pulseDot { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      @keyframes titlePulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="820" height="240" fill="url(#bg)" rx="14"/>
  <rect width="820" height="240" fill="url(#grid)" rx="14"/>
  <rect x="0" y="118" width="820" height="1" fill="url(#glow)" class="scan" opacity="0.5"/>

  <rect x="16" y="16" width="788" height="208" rx="12" fill="#0a0a12" stroke="#1f2937" stroke-width="1"/>
  <rect x="16" y="16" width="788" height="28" rx="12" fill="#111827"/>
  <rect x="16" y="32" width="788" height="12" fill="#111827"/>
  <circle cx="36" cy="30" r="5" fill="#ff5f57"/>
  <circle cx="54" cy="30" r="5" fill="#febc2e"/>
  <circle cx="72" cy="30" r="5" fill="#28c840"/>
  <text x="410" y="34" text-anchor="middle" class="mono" fill="#6b7280" font-size="11">sanath@github - initialize_profile.sh</text>

  <g clip-path="url(#termClip)">
    <text x="40" y="72" class="mono fade1" fill="#64748b" font-size="13">$ ./initialize_profile --mode=production</text>
    <text x="40" y="98" class="mono fade2" fill="#00d4ff" font-size="13">&gt; loading engineering stack...</text>
    <text x="40" y="122" class="mono fade3" fill="#a78bfa" font-size="13">&gt; mounting AI agents and LLM pipelines...</text>
    <text x="40" y="146" class="mono fade4" fill="#94a3b8" font-size="13">&gt; syncing projects: WorthyApply, EduAI, portfolioo</text>
    <rect x="40" y="158" width="520" height="6" rx="3" fill="#1e293b" class="fade5"/>
    <rect x="40" y="158" width="520" height="6" rx="3" fill="url(#accent)" class="barFill"/>
    <text x="40" y="188" class="mono fade6" fill="#e2e8f0" font-size="14">status: <tspan fill="#22d3ee" class="pulse">ONLINE</tspan> - building intelligent systems</text>
    <text x="40" y="214" class="mono titleGlow" fill="#f8fafc" font-size="22" font-weight="700" filter="url(#softGlow)">SANATH WARAIKAR</text>
    <text x="40" y="232" class="mono fade6" fill="#64748b" font-size="12">full-stack engineer / AI-powered products</text>
  </g>
</svg>
