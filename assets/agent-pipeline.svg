<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="AI agent pipeline visualization">
  <defs>
    <linearGradient id="canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .packet1 { animation: travel1 3.2s linear infinite; }
      .packet2 { animation: travel2 3.2s linear infinite; animation-delay: 0.8s; }
      .packet3 { animation: travel3 3.2s linear infinite; animation-delay: 1.6s; }
      .packet4 { animation: travel4 3.2s linear infinite; animation-delay: 2.4s; }
      .nodePulse { animation: nodePulse 2.5s ease-in-out infinite; }
      .nodePulse2 { animation: nodePulse 2.5s ease-in-out 0.5s infinite; }
      .nodePulse3 { animation: nodePulse 2.5s ease-in-out 1s infinite; }
      .nodePulse4 { animation: nodePulse 2.5s ease-in-out 1.5s infinite; }
      .nodePulse5 { animation: nodePulse 2.5s ease-in-out 2s infinite; }
      @keyframes travel1 { 0% { transform: translate(90px, 95px); opacity: 0; } 8% { opacity: 1; } 22% { transform: translate(220px, 95px); opacity: 1; } 28% { opacity: 0; } 100% { transform: translate(220px, 95px); opacity: 0; } }
      @keyframes travel2 { 0% { transform: translate(220px, 95px); opacity: 0; } 8% { opacity: 1; } 22% { transform: translate(350px, 95px); opacity: 1; } 28% { opacity: 0; } 100% { transform: translate(350px, 95px); opacity: 0; } }
      @keyframes travel3 { 0% { transform: translate(350px, 95px); opacity: 0; } 8% { opacity: 1; } 22% { transform: translate(480px, 95px); opacity: 1; } 28% { opacity: 0; } 100% { transform: translate(480px, 95px); opacity: 0; } }
      @keyframes travel4 { 0% { transform: translate(480px, 95px); opacity: 0; } 8% { opacity: 1; } 22% { transform: translate(610px, 95px); opacity: 1; } 28% { opacity: 0; } 100% { transform: translate(610px, 95px); opacity: 0; } }
      @keyframes nodePulse { 0%,100% { stroke-opacity: 0.45; } 50% { stroke-opacity: 1; } }
    </style>
  </defs>

  <rect width="820" height="220" rx="12" fill="url(#canvas)"/>
  <text x="410" y="28" text-anchor="middle" class="mono" fill="#64748b" font-size="11" letter-spacing="3">AGENT PIPELINE - HOW I SHIP AI PRODUCTS</text>

  <path d="M 90 95 L 220 95" stroke="url(#flow)" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M 220 95 L 350 95" stroke="url(#flow)" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M 350 95 L 480 95" stroke="url(#flow)" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M 480 95 L 610 95" stroke="url(#flow)" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M 610 95 L 740 95" stroke="url(#flow)" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>

  <circle r="4" fill="#00d4ff" class="packet1"/>
  <circle r="4" fill="#67e8f9" class="packet2"/>
  <circle r="4" fill="#a78bfa" class="packet3"/>
  <circle r="4" fill="#8b5cf6" class="packet4"/>

  <g filter="url(#nodeGlow)">
    <rect x="50" y="70" width="80" height="50" rx="8" fill="#0b1220" stroke="#00d4ff" stroke-width="1.2" class="nodePulse"/>
    <rect x="180" y="70" width="80" height="50" rx="8" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2" class="nodePulse2"/>
    <rect x="310" y="70" width="80" height="50" rx="8" fill="#0b1220" stroke="#38bdf8" stroke-width="1.2" class="nodePulse3"/>
    <rect x="440" y="70" width="80" height="50" rx="8" fill="#0b1220" stroke="#8b5cf6" stroke-width="1.2" class="nodePulse4"/>
    <rect x="570" y="70" width="80" height="50" rx="8" fill="#0b1220" stroke="#a78bfa" stroke-width="1.2" class="nodePulse5"/>
    <rect x="700" y="70" width="80" height="50" rx="8" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2" class="nodePulse"/>
  </g>

  <text x="90" y="92" text-anchor="middle" class="mono" fill="#e2e8f0" font-size="10">INPUT</text>
  <text x="90" y="106" text-anchor="middle" class="mono" fill="#64748b" font-size="9">docs + JD</text>
  <text x="220" y="92" text-anchor="middle" class="mono" fill="#e2e8f0" font-size="10">EXTRACT</text>
  <text x="220" y="106" text-anchor="middle" class="mono" fill="#64748b" font-size="9">parse + OCR</text>
  <text x="350" y="92" text-anchor="middle" class="mono" fill="#e2e8f0" font-size="10">REASON</text>
  <text x="350" y="106" text-anchor="middle" class="mono" fill="#64748b" font-size="9">LLM + agents</text>
  <text x="480" y="92" text-anchor="middle" class="mono" fill="#e2e8f0" font-size="10">STRUCTURE</text>
  <text x="480" y="106" text-anchor="middle" class="mono" fill="#64748b" font-size="9">Pydantic + RAG</text>
  <text x="610" y="92" text-anchor="middle" class="mono" fill="#e2e8f0" font-size="10">SHIP</text>
  <text x="610" y="106" text-anchor="middle" class="mono" fill="#64748b" font-size="9">API + UI</text>
  <text x="740" y="92" text-anchor="middle" class="mono" fill="#e2e8f0" font-size="10">LIVE</text>
  <text x="740" y="106" text-anchor="middle" class="mono" fill="#22d3ee" font-size="9">PROD</text>

  <text x="410" y="175" text-anchor="middle" class="mono" fill="#94a3b8" font-size="12">resume + job description -&gt; structured analysis -&gt; deployed product</text>
  <text x="410" y="198" text-anchor="middle" class="mono" fill="#475569" font-size="10">the same pipeline powers WorthyApply, EduAI, and my document-to-model workflows</text>
</svg>
